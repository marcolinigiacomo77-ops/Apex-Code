<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apex Code — Explainer (Tech Glow, 40 s)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Space+Grotesk:wght@400;700&display=block">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:#05061c;color:#eef2ff;font:15px Inter,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
#wrap{flex:1;min-height:0;display:grid;place-items:center}
#box{position:relative;background:#000}

#bar{display:flex;gap:14px;align-items:center;padding:10px 16px;flex-wrap:wrap}
#bar button{background:#3d7bff;color:#fff;border:0;padding:8px 16px;border-radius:8px;font:inherit;cursor:pointer}
#bar input[type=range]{flex:1;min-width:120px;accent-color:#3fe3ff}
#bar label{display:flex;gap:6px;align-items:center}
#fs{position:absolute;right:14px;bottom:14px;z-index:2;background:rgba(5,7,20,.78);color:#fff;border:1px solid rgba(255,255,255,.28);padding:8px 14px;border-radius:8px;font:600 13px Inter,system-ui,sans-serif;cursor:pointer}
#fs:hover{background:rgba(61,123,255,.85)}
#bar button:focus-visible,#bar input:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style></head><body>
<div id="wrap"><div id="box"><canvas id="cv" width="1280" height="720"></canvas><button id="fs" type="button">⛶ Schermo intero</button></div></div>
<div id="bar" style="display:none"><button id="pp" type="button">Pausa</button><input id="sc" type="range" min="0" max="1000" value="0" aria-label="Scorri il video"><span id="tm">0,0 / 24,5 s</span><button id="snd" type="button" aria-pressed="true">Suono: sì</button><label><input id="loop" type="checkbox" checked> Loop</label></div>
<script>
const W=1280,Hh=720;
// ---- H (sottoinsieme della libreria, funzioni copiate dal riferimento) ----
const H={
 clamp:(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp:(a,b,t)=>a+(b-a)*t,
 hex:h=>{h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255]},
 rgba(c,a=1){const[r,g,b]=Array.isArray(c)?c:H.hex(c);return`rgba(${r|0},${g|0},${b|0},${a})`},
 mix(c1,c2,t){const a=Array.isArray(c1)?c1:H.hex(c1),b=Array.isArray(c2)?c2:H.hex(c2);return[0,1,2].map(i=>a[i]+(b[i]-a[i])*t)},
 layer:(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c},
 vignette(ctx,W,Hh,s=.5,col='0,0,0'){const g=ctx.createRadialGradient(W/2,Hh/2,Math.min(W,Hh)*.3,W/2,Hh/2,Math.hypot(W,Hh)*.6);g.addColorStop(0,`rgba(${col},0)`);g.addColorStop(1,`rgba(${col},${s})`);ctx.save();ctx.fillStyle=g;ctx.fillRect(0,0,W,Hh);ctx.restore()},
 rng(seed=1){let a=(seed>>>0)||1;const r=()=>{a|=0;a=(a+0x6d2b79f5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296};r.range=(l,h)=>l+r()*(h-l);r.pick=x=>x[Math.floor(r()*x.length)];return r}
};
const cl=H.clamp,lerp=H.lerp,rgb=(c,a)=>H.rgba(c,a),fract=x=>x-Math.floor(x);
const HEAD='"Space Grotesk"',UI='"Inter"',F=(w,s,fam)=>`${w} ${s}px ${fam||HEAD}`;
const C={cyan:'#3fe3ff',blue:'#3d7bff',violet:'#8f5bff',magenta:'#e04dff',indigo:'#4b3bff',red:'#ff4f7a',green:'#3cf0b4',white:'#eef2ff',muted:'#9aa3d8'};
const GRAD_HEAD=['#ffffff','#c8f4ff','#7fdcff','#9a78ff'],GRAD_NUM=['#7ff0ff','#5d9bff','#a77bff'];
const rr=(c,x,y,w,h,r)=>{c.beginPath();c.roundRect(x,y,w,h,r)};

// ---- icone ----
const dot=(c,x,y,r)=>{c.moveTo(x+r,y);c.arc(x,y,r,0,Math.PI*2)};
const ICONS={
 code(c,u){c.moveTo(-.3*u,-.5*u);c.lineTo(-.8*u,0);c.lineTo(-.3*u,.5*u);c.moveTo(.3*u,-.5*u);c.lineTo(.8*u,0);c.lineTo(.3*u,.5*u);c.moveTo(.13*u,-.62*u);c.lineTo(-.13*u,.62*u)},
 cart(c,u){c.moveTo(-.85*u,-.6*u);c.lineTo(-.55*u,-.6*u);c.lineTo(-.25*u,.3*u);c.lineTo(.6*u,.3*u);c.lineTo(.82*u,-.3*u);c.lineTo(-.5*u,-.3*u);dot(c,-.15*u,.66*u,.1*u);dot(c,.5*u,.66*u,.1*u)},
 calendar(c,u){c.roundRect(-.72*u,-.55*u,1.44*u,1.3*u,.12*u);c.moveTo(-.72*u,-.15*u);c.lineTo(.72*u,-.15*u);c.moveTo(-.36*u,-.82*u);c.lineTo(-.36*u,-.4*u);c.moveTo(.36*u,-.82*u);c.lineTo(.36*u,-.4*u);c.moveTo(-.32*u,.3*u);c.lineTo(-.1*u,.5*u);c.lineTo(.34*u,.05*u)},
 camera(c,u){c.roundRect(-.82*u,-.4*u,1.64*u,1.1*u,.14*u);c.moveTo(-.3*u,-.4*u);c.lineTo(-.15*u,-.7*u);c.lineTo(.25*u,-.7*u);c.lineTo(.4*u,-.4*u);dot(c,0,.15*u,.3*u)},
 check(c,u){c.moveTo(-.58*u,.02*u);c.lineTo(-.16*u,.44*u);c.lineTo(.62*u,-.42*u)},
 cross(c,u){c.moveTo(-.45*u,-.45*u);c.lineTo(.45*u,.45*u);c.moveTo(.45*u,-.45*u);c.lineTo(-.45*u,.45*u)},
 chart(c,u){c.moveTo(-.76*u,-.72*u);c.lineTo(-.76*u,.7*u);c.lineTo(.8*u,.7*u);c.moveTo(-.52*u,.36*u);c.lineTo(-.18*u,.02*u);c.lineTo(.1*u,.2*u);c.lineTo(.58*u,-.42*u);c.moveTo(.3*u,-.44*u);c.lineTo(.6*u,-.44*u);c.lineTo(.6*u,-.14*u)}
};

// ---- sfondo: gradiente, glow, griglia prospettica, particelle ----
const GLOWS=[{c:C.blue,x:.16,y:.24,r:520,a:.24},{c:C.violet,x:.82,y:.18,r:560,a:.3},{c:C.cyan,x:.6,y:.95,r:440,a:.17},{c:C.magenta,x:1,y:.72,r:380,a:.17},{c:C.indigo,x:.42,y:.62,r:560,a:.12}];
const PARTS=(()=>{const r=H.rng(77);return Array.from({length:90},()=>({x:r(),y:r(),s:r.range(.6,2.1),sp:r.range(.004,.018),ph:r()*6.28,c:r.pick([C.cyan,C.violet,'#ffffff',C.blue]),z:r.range(.3,1)}))})();
function background(ctx,W,Hh,t,camX=0,lvl=1){
 const g=ctx.createLinearGradient(0,0,W*.5,Hh);g.addColorStop(0,'#03041a');g.addColorStop(.55,'#080a2d');g.addColorStop(1,'#120b3c');ctx.fillStyle=g;ctx.fillRect(0,0,W,Hh);
 ctx.save();ctx.globalCompositeOperation='lighter';
 GLOWS.forEach((b,i)=>{const x=(b.x+.05*Math.sin(t*.21+i*1.9))*W-camX*.1,y=(b.y+.06*Math.cos(t*.17+i*2.7))*Hh,r=b.r*(1+.07*Math.sin(t*.3+i)),rg=ctx.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,rgb(b.c,b.a*lvl));rg.addColorStop(.4,rgb(b.c,b.a*.38*lvl));rg.addColorStop(1,rgb(b.c,0));ctx.fillStyle=rg;ctx.fillRect(x-r,y-r,2*r,2*r)});
 ctx.restore();
 ctx.save();const ox=((-camX*.3)%40+40)%40;for(let y=20;y<Hh*.56;y+=40){ctx.fillStyle=`rgba(150,170,255,${.09*lvl*(y/(Hh*.56))})`;for(let x=ox;x<W;x+=40)ctx.fillRect(x-1,y-1,2,2)}ctx.restore();
 const hy=Hh*.6,vx=W/2-camX*.25;ctx.save();ctx.lineWidth=1;
 const sg=ctx.createLinearGradient(0,hy,0,Hh);sg.addColorStop(0,'rgba(110,140,255,0)');sg.addColorStop(.3,`rgba(110,140,255,${.07*lvl})`);sg.addColorStop(1,`rgba(140,170,255,${.22*lvl})`);ctx.strokeStyle=sg;ctx.beginPath();
 const sh=fract(camX/900);for(let i=-34;i<=34;i++){const k=i-sh;ctx.moveTo(vx+k*12,hy);ctx.lineTo(vx+k*190,Hh+260)}
 const roll=fract(t*.35);for(let k=0;k<26;k++){const d=k+1-roll,y=hy+230/d;if(y>Hh+2)continue;ctx.moveTo(0,y);ctx.lineTo(W,y)}ctx.stroke();
 const hz=ctx.createLinearGradient(0,0,W,0);hz.addColorStop(0,'rgba(90,140,255,0)');hz.addColorStop(.5,`rgba(120,180,255,${.18*lvl})`);hz.addColorStop(1,'rgba(90,140,255,0)');ctx.fillStyle=hz;ctx.fillRect(0,hy-1,W,2);ctx.restore();
 ctx.save();ctx.globalCompositeOperation='lighter';
 for(const p of PARTS){const x=fract(p.x+.006*Math.sin(t*.5+p.ph)-camX*.0003*p.z)*W,y=fract(p.y-t*p.sp)*Hh,a=(.2+.55*(.5+.5*Math.sin(t*1.7+p.ph*3)))*lvl*p.z;
  if(p.s>1.7){const rg=ctx.createRadialGradient(x,y,0,x,y,p.s*6);rg.addColorStop(0,rgb(p.c,a*.35));rg.addColorStop(1,rgb(p.c,0));ctx.fillStyle=rg;ctx.fillRect(x-p.s*6,y-p.s*6,p.s*12,p.s*12)}
  ctx.fillStyle=rgb(p.c,a);ctx.beginPath();ctx.arc(x,y,p.s*.7,0,6.283);ctx.fill()}
 ctx.restore();
}
// ---- bloom ----
let BL=null;
function bloom(ctx,amt=1){const cv=ctx.canvas;if(!BL)BL={a:H.layer(320,180),b:H.layer(320,180),c:H.layer(160,90)};
 const a=BL.a.getContext('2d'),b=BL.b.getContext('2d'),c=BL.c.getContext('2d');
 a.globalCompositeOperation='copy';a.filter='brightness(0.9) contrast(2.6) saturate(1.4)';a.drawImage(cv,0,0,320,180);a.filter='none';
 b.globalCompositeOperation='copy';b.filter='blur(2.5px)';b.drawImage(BL.a,0,0);b.filter='none';
 c.globalCompositeOperation='copy';c.filter='blur(4px)';c.drawImage(BL.a,0,0,160,90);c.filter='none';
 ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.45*amt;ctx.drawImage(BL.b,0,0,cv.width,cv.height);ctx.globalAlpha=.5*amt;ctx.drawImage(BL.c,0,0,cv.width,cv.height);ctx.restore()}

// ---- blocchi ----
function glowDot(ctx,x,y,col,r,a=1){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgb('#ffffff',a));g.addColorStop(.16,rgb(col,.9*a));g.addColorStop(.45,rgb(col,.22*a));g.addColorStop(1,rgb(col,0));ctx.fillStyle=g;ctx.fillRect(x-r,y-r,2*r,2*r)}
function ring(ctx,x,y,r,col,a,lw=2){ctx.save();ctx.globalCompositeOperation='lighter';ctx.strokeStyle=rgb(col,a);ctx.lineWidth=lw;ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.stroke();ctx.restore()}
function card(ctx,x,y,w,h,o={}){
 const r=o.r??22,acc=o.acc||[C.cyan,C.violet];ctx.save();ctx.globalAlpha*=o.a??1;
 ctx.shadowColor='rgba(0,0,12,0.6)';ctx.shadowBlur=44;ctx.shadowOffsetY=18;
 const fg=ctx.createLinearGradient(x,y,x,y+h);fg.addColorStop(0,'rgba(22,26,72,0.8)');fg.addColorStop(1,'rgba(8,9,32,0.86)');ctx.fillStyle=fg;rr(ctx,x,y,w,h,r);ctx.fill();ctx.shadowColor='transparent';
 ctx.save();rr(ctx,x,y,w,h,r);ctx.clip();
 const ig=ctx.createRadialGradient(x+w*.25,y,0,x+w*.25,y,Math.max(w,h)*.8);ig.addColorStop(0,rgb(acc[0],.17));ig.addColorStop(1,rgb(acc[0],0));ctx.fillStyle=ig;ctx.fillRect(x,y,w,h);
 const ig2=ctx.createRadialGradient(x+w,y+h,0,x+w,y+h,Math.max(w,h)*.7);ig2.addColorStop(0,rgb(acc[1],.14));ig2.addColorStop(1,rgb(acc[1],0));ctx.fillStyle=ig2;ctx.fillRect(x,y,w,h);ctx.restore();
 const bg=ctx.createLinearGradient(x,y,x+w,y+h);bg.addColorStop(0,rgb(acc[0],.95));bg.addColorStop(.4,rgb(acc[1],.4));bg.addColorStop(.72,'rgba(255,255,255,0.07)');bg.addColorStop(1,rgb(acc[1],.6));
 ctx.strokeStyle=bg;ctx.lineWidth=1.5;rr(ctx,x+.75,y+.75,w-1.5,h-1.5,r);ctx.stroke();
 const hl=ctx.createLinearGradient(x,0,x+w,0);hl.addColorStop(0,'rgba(255,255,255,0)');hl.addColorStop(.3,'rgba(200,240,255,0.5)');hl.addColorStop(.65,'rgba(255,255,255,0)');
 ctx.strokeStyle=hl;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x+r,y+1.5);ctx.lineTo(x+w-r,y+1.5);ctx.stroke();
 if(o.flash>.01){ctx.globalCompositeOperation='lighter';ctx.strokeStyle=rgb(o.flashCol||C.cyan,o.flash);ctx.lineWidth=3;rr(ctx,x+1,y+1,w-2,h-2,r);ctx.stroke()}
 ctx.restore()}
function tile(ctx,cx,cy,s,icon,o={}){
 const col=o.col||[C.cyan,C.violet],glow=o.glow??1;const al=o.a??1,sc=o.sc??1,dr=o.draw??1;if(al<=.003||sc<=.003)return;ctx.save();ctx.translate(cx,cy);ctx.scale(sc,sc);ctx.globalAlpha*=al;const r=s*.26,h=s/2;
 ctx.save();ctx.globalCompositeOperation='lighter';const hg=ctx.createRadialGradient(0,0,s*.25,0,0,s*1.15);hg.addColorStop(0,rgb(col[0],Math.min(.5,.2*glow)));hg.addColorStop(.5,rgb(col[1],Math.min(.25,.07*glow)));hg.addColorStop(1,rgb(col[1],0));ctx.fillStyle=hg;ctx.fillRect(-s*1.15,-s*1.15,s*2.3,s*2.3);ctx.restore();
 ctx.save();ctx.shadowColor='rgba(0,0,10,0.55)';ctx.shadowBlur=s*.3;ctx.shadowOffsetY=s*.1;const bg=ctx.createLinearGradient(0,-h,0,h);bg.addColorStop(0,'#171b4d');bg.addColorStop(1,'#090a28');ctx.fillStyle=bg;rr(ctx,-h,-h,s,s,r);ctx.fill();ctx.restore();
 ctx.save();rr(ctx,-h,-h,s,s,r);ctx.clip();
 const ig=ctx.createRadialGradient(-h*.5,-h*.7,0,-h*.5,-h*.7,s);ig.addColorStop(0,rgb(col[0],.3));ig.addColorStop(1,rgb(col[0],0));ctx.fillStyle=ig;ctx.fillRect(-h,-h,s,s);
 const ig2=ctx.createRadialGradient(h*.6,h*.8,0,h*.6,h*.8,s*.8);ig2.addColorStop(0,rgb(col[1],.26));ig2.addColorStop(1,rgb(col[1],0));ctx.fillStyle=ig2;ctx.fillRect(-h,-h,s,s);
 if(glow>1.05){ctx.fillStyle=rgb(col[0],Math.min(.25,(glow-1)*.12));ctx.fillRect(-h,-h,s,s)}ctx.restore();
 const sg=ctx.createLinearGradient(-h,-h,h,h);sg.addColorStop(0,H.rgba(H.mix(col[0],'#ffffff',.2),1));sg.addColorStop(1,col[1]);
 ctx.strokeStyle=sg;ctx.lineWidth=Math.max(1.6,s*.022);rr(ctx,-h+1,-h+1,s-2,s-2,r);ctx.stroke();
 ctx.strokeStyle='rgba(255,255,255,0.09)';ctx.lineWidth=1;rr(ctx,-h+6,-h+6,s-12,s-12,r*.75);ctx.stroke();
 const icg=ctx.createLinearGradient(-h*.5,-h*.5,h*.5,h*.5);icg.addColorStop(0,H.rgba(H.mix(col[0],'#ffffff',.45),1));icg.addColorStop(1,H.rgba(H.mix(col[1],'#ffffff',.15),1));
 ctx.strokeStyle=icg;ctx.lineWidth=Math.max(1.8,s*.042);ctx.lineCap='round';ctx.lineJoin='round';if(dr>0){if(dr<1)ctx.setLineDash([dr*s*2.4,1e4]);ctx.beginPath();ICONS[icon](ctx,s*.3);ctx.stroke();ctx.setLineDash([])}ctx.restore()}
function pill(ctx,x,y,text,o={}){
 const al=o.a??1;if(al<=.003)return;const size=o.size||24,col=o.col||[C.cyan,C.violet];ctx.save();ctx.globalAlpha*=al;ctx.translate(x,y);ctx.scale(o.sc??1,o.sc??1);
 ctx.font=F(600,size,UI);const tw=ctx.measureText(text).width,dotW=o.dot?size*.75:0,w=tw+size*1.3+dotW,h=size*1.62;
 ctx.fillStyle=o.fill||'rgba(10,12,42,0.88)';rr(ctx,-w/2,-h/2,w,h,h/2);ctx.fill();
 const g=ctx.createLinearGradient(-w/2,0,w/2,0);g.addColorStop(0,rgb(col[0],.9));g.addColorStop(1,rgb(col[1],.7));ctx.strokeStyle=g;ctx.lineWidth=1.4;rr(ctx,-w/2+.7,-h/2+.7,w-1.4,h-1.4,h/2);ctx.stroke();
 if(o.dot){ctx.fillStyle=col[0];ctx.beginPath();ctx.arc(-w/2+size*.75,0,size*.17,0,6.283);ctx.fill()}
 ctx.fillStyle=C.white;ctx.textBaseline='middle';ctx.textAlign='left';ctx.fillText(text,-w/2+size*.65+dotW,size*.04);ctx.restore()}
function gtext(ctx,s,x,y,size,o={}){
 ctx.font=F(o.w||700,size,o.fam);ctx.textAlign='left';ctx.textBaseline='alphabetic';
 const w=ctx.measureText(s).width,x0=o.align==='center'?x-w/2:o.align==='right'?x-w:x,cols=o.cols||GRAD_HEAD,g=ctx.createLinearGradient(x0,y-size,x0+w,y);
 cols.forEach((c,i)=>g.addColorStop(i/(cols.length-1),c));ctx.fillStyle=g;ctx.fillText(s,x0,y);return w}
function ui(ctx,s,x,y,size,col,align='left',w=400){ctx.font=F(w,size,UI);ctx.fillStyle=col||'#b3bbec';ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.fillText(s,x,y)}
function eyebrow(ctx,s,x,y,o={}){
 const size=o.size||18,col=o.col||C.cyan;ctx.save();ctx.font=F(600,size,UI);ctx.letterSpacing='3px';
 const w=ctx.measureText(s).width+22,x0=o.align==='center'?x-w/2:x;
 ctx.globalCompositeOperation='lighter';glowDot(ctx,x0+5,y-size*.36,col,12);ctx.globalCompositeOperation='source-over';
 ctx.fillStyle=col;ctx.beginPath();ctx.arc(x0+5,y-size*.36,3.2,0,6.283);ctx.fill();
 ctx.fillStyle=rgb(H.mix(col,'#ffffff',.25),1);ctx.textAlign='left';ctx.fillText(s,x0+22,y);ctx.letterSpacing='0px';ctx.restore()}
// ---- connettori + impulsi ----
function bez(x0,y0,x1,y1,x2,y2,x3,y3,n=48){const P=[];let L=0,px=x0,py=y0;for(let i=0;i<=n;i++){const u=i/n,m=1-u,x=m*m*m*x0+3*m*m*u*x1+3*m*u*u*x2+u*u*u*x3,y=m*m*m*y0+3*m*m*u*y1+3*m*u*u*y2+u*u*u*y3;if(i)L+=Math.hypot(x-px,y-py);P.push({x,y,l:L});px=x;py=y}P.L=L;return P}
const seg2=(x0,y0,x1,y1)=>bez(x0,y0,lerp(x0,x1,.33),lerp(y0,y1,.33),lerp(x0,x1,.66),lerp(y0,y1,.66),x1,y1,8);
function ptAt(P,f){const tl=cl(f)*P.L;for(let i=1;i<P.length;i++)if(P[i].l>=tl){const a=P[i-1],b=P[i],k=(tl-a.l)/Math.max(1e-6,b.l-a.l);return{x:lerp(a.x,b.x,k),y:lerp(a.y,b.y,k)}}return P[P.length-1]}
function sub(ctx,P,a,b){a=cl(a);b=cl(b);ctx.beginPath();if(b<=a)return;const s=ptAt(P,a);ctx.moveTo(s.x,s.y);const la=a*P.L,lb=b*P.L;for(const p of P)if(p.l>la&&p.l<lb)ctx.lineTo(p.x,p.y);const e=ptAt(P,b);ctx.lineTo(e.x,e.y)}
function pulseOn(ctx,P,p,col,len=.16){ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
 for(let i=0;i<8;i++){const a0=p-len*(i+1)/8,a1=p-len*i/8;if(a1<=0||a0>=1)continue;ctx.strokeStyle=rgb(col,.85*(1-i/8));ctx.lineWidth=3.4-i*.3;sub(ctx,P,a0,a1);ctx.stroke()}
 const h=ptAt(P,p);glowDot(ctx,h.x,h.y,col,18,1);ctx.restore()}
function connector(ctx,P,o={}){
 const d=o.draw??1;if(d<=0)return;const c0=(o.col||[])[0]||C.cyan,c1=(o.col||[])[1]||C.violet;ctx.save();ctx.lineCap='round';
 const s=P[0],e=P[P.length-1],g=ctx.createLinearGradient(s.x,s.y,e.x,e.y);g.addColorStop(0,rgb(c0,.75));g.addColorStop(1,rgb(c1,.75));
